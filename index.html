
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Challenge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>🎯 Quiz Challenge</h1>
    <p>¡Pon a prueba tus conocimientos!</p>

    <h2 id="question">¿Cuál es la capital de España?</h2>

    <div id="answers">
      <button onclick="answer(false)">Barcelona</button>
      <button onclick="answer(true)">Madrid</button>
      <button onclick="answer(false)">Sevilla</button>
      <button onclick="answer(false)">Valencia</button>
    </div>

    <p id="feedback">Elige una respuesta.</p>
    <p>Puntos: <span id="score">0</span></p>

    <button id="next" onclick="nextQuestion()" hidden>
      Siguiente pregunta
    </button>
  </main>

  <script src="game.js"></script>
</body>
</html>
